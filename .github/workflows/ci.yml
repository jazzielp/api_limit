name: CI

on:
  push:
    branches: [main, master, actions]
  pull_request:
    branches: [main, master, actions]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create CI env files
        run: |
          printf '%s\n' \
            'NODE_ENV=test' \
            'PORT=3001' \
            'DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/api_limit_test' \
            'JWT_SECRET=test-secret-must-be-at-least-32-characters-long' \
            'JWT_ISSUER=api_limit_test' \
            'JWT_AUDIENCE=api_limit_test_users' \
            'ACCESS_TOKEN_TTL_MINUTES=15' \
            'MAIL_DRIVER=console' \
            'MAIL_FROM=test@example.com' \
            'LOG_LEVEL=silent' \
            > .env.test
          cp .env.test .env.development

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
